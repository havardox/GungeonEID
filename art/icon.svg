<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#6a2fa0"/>
      <stop offset="0.55" stop-color="#36185e"/>
      <stop offset="1" stop-color="#170a2a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.45" stop-color="#ffc943"/>
      <stop offset="1" stop-color="#d0861c"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4a8fd8"/>
      <stop offset="1" stop-color="#1d3c7a"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9761a"/>
      <stop offset="0.35" stop-color="#ffd86b"/>
      <stop offset="0.6" stop-color="#f2b437"/>
      <stop offset="1" stop-color="#9c5f12"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f3d1c"/>
      <stop offset="0.35" stop-color="#f08a52"/>
      <stop offset="0.6" stop-color="#d4642e"/>
      <stop offset="1" stop-color="#6e2a12"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2f52"/>
      <stop offset="0.4" stop-color="#5a4a78"/>
      <stop offset="1" stop-color="#231a33"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="216" cy="216" r="122"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#08030f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(-14 -10)">
    <!-- handle -->
    <g transform="translate(216 216) rotate(-45)">
      <rect x="-30" y="150" width="60" height="44" rx="8" fill="url(#rim)"/>
      <rect x="-30" y="166" width="60" height="6" fill="#b0701a" opacity="0.6"/>
      <rect x="-34" y="190" width="68" height="150" rx="34" fill="url(#handle)"/>
    </g>

    <!-- lens -->
    <circle cx="216" cy="216" r="122" fill="url(#glass)"/>
    <g clip-path="url(#lens)">
      <!-- magnified bullet -->
      <g transform="translate(214 220) rotate(45) scale(0.74)">
        
        <path d="M-40 -18 C -40 -78, -18 -128, 0 -142 C 18 -128, 40 -78, 40 -18 Z" fill="url(#copper)"/>
        <rect x="-42" y="-20" width="84" height="132" rx="4" fill="url(#brass)"/>
        <rect x="-42" y="-20" width="84" height="8" fill="#8a5410" opacity="0.45"/>
        <rect x="-38" y="104" width="76" height="10" fill="#8a5410"/>
        <rect x="-44" y="112" width="88" height="20" rx="4" fill="url(#brass)"/>
        <rect x="-24" y="-118" width="10" height="70" rx="5" fill="#ffd0b0" opacity="0.5" transform="rotate(8 -19 -83)"/>
        <rect x="-26" y="-6" width="12" height="104" rx="6" fill="#fff6d0" opacity="0.55"/>
      </g>
      <!-- glare -->
      <path d="M 120 190 A 100 100 0 0 1 200 112" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.45"/>
      <circle cx="112" cy="222" r="8" fill="#ffffff" opacity="0.45"/>
    </g>
    <circle cx="216" cy="216" r="122" fill="none" stroke="url(#rim)" stroke-width="30"/>
    <circle cx="216" cy="216" r="107" fill="none" stroke="#a8661a" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- sparkle -->
  <path d="M398 92 L408 120 L436 130 L408 140 L398 168 L388 140 L360 130 L388 120 Z" fill="#ffe28a"/>
  <path d="M440 190 L445 203 L458 208 L445 213 L440 226 L435 213 L422 208 L435 203 Z" fill="#ffe28a" opacity="0.8"/>
</svg>
